<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Little Loops – Custom Crochet Bunny</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#fff8f3;--card:#fff;--ink:#4a3b3b;--mut:#8a7777;--line:#f0dcd3;--acc:#e98a9b;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241d1e;--card:#2f2627;--ink:#f6e9e4;--mut:#b9a6a3;--line:#4a3b3c;--accink:#2a1a1d}}
:root[data-theme="dark"]{--bg:#241d1e;--card:#2f2627;--ink:#f6e9e4;--mut:#b9a6a3;--line:#4a3b3c;--accink:#2a1a1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,-apple-system,sans-serif;line-height:1.5}
header{text-align:center;padding:28px 16px 8px}
header h1{margin:0;font-size:2rem;font-weight:600}
header p{margin:4px 0 0;color:var(--mut)}
main{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:20px;grid-template-columns:1fr 1fr;align-items:start}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.preview{position:sticky;top:12px}
#stage{position:relative;overflow:hidden;border-radius:16px;background:#fff;min-height:260px;touch-action:none}
#stage.edit{outline:3px dashed var(--acc);cursor:move}
#baseimg{display:block;width:100%;height:auto}
.ly{position:absolute;pointer-events:none;user-select:none}
#empty{display:flex;align-items:center;justify-content:center;text-align:center;min-height:260px;padding:20px;color:#8a7777;font-size:.95rem}
.price{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:500}
.price b{font-size:1.4rem;color:var(--acc)}
h2{font-size:1.05rem;margin:18px 0 8px}
h2:first-child{margin-top:0}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.pick{width:84px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;border-radius:14px;padding:5px;cursor:pointer;text-align:center;font-size:.75rem;line-height:1.2}
.pick[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.pick .th{height:64px;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:4px;color:#8a7777;font-size:1.3rem}
.pick .th img{width:100%;height:100%;object-fit:contain}
.pick small{color:var(--mut);display:block}
label{display:block;font-size:.9rem;margin:10px 0 4px;color:var(--mut)}
input,textarea,select{width:100%;font:inherit;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=range]{padding:0}
input[type=checkbox]{width:auto}
textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.go,.btn{font:inherit;font-weight:600;padding:10px 14px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);cursor:pointer}
button.go{margin-top:16px;width:100%;padding:12px;font-size:1.05rem;border-radius:14px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
#summary{display:none;margin-top:14px;border-top:2px dashed var(--line);padding-top:14px}
#summary pre{white-space:pre-wrap;font:inherit;background:var(--bg);padding:12px;border-radius:12px;font-size:.9rem;margin:0 0 10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns a,.btns button{flex:1;text-align:center;text-decoration:none;font:inherit;padding:10px;border-radius:12px;border:1.5px solid var(--acc);color:var(--ink);background:var(--card);cursor:pointer}
.note{font-size:.8rem;color:var(--mut);margin-top:8px}
#adminBar{max-width:1000px;margin:0 auto;padding:0 16px;text-align:right}
#admin{max-width:1000px;margin:12px auto 0;border:2px solid var(--acc)}
.irow{display:grid;grid-template-columns:1fr 80px auto auto;gap:6px;align-items:center;margin:6px 0;padding:6px;border-radius:12px;border:1.5px solid var(--line)}
.irow.on{border-color:var(--acc);background:var(--bg)}
.irow small{grid-column:1/-1;color:var(--mut)}
[hidden]{display:none!important}
</style></head><body><div id="root"></div><template id="tpl">
<header><h1>🐰 Little Loops</h1><p>Handmade crochet bunnies – dress yours up your way</p></header>
<div id="adminBar" hidden=""><button class="btn" id="adminBtn" type="button">✏️ Edit shop</button></div>
<section id="admin" class="card" hidden="">
  <h2>Shop owner tools</h2>
  <p class="note" style="margin-top:0">Only you can see this. Upload photos, drag/resize accessories on the preview, then press <b>Save &amp; publish</b> so customers see your changes.</p>
  <div class="row">
    <div><label>Base doll photo</label><input id="baseUp" type="file" accept="image/*"></div>
    <div><label>Base price</label><input id="basePrice" type="number" min="0"></div>
  </div>
  <div class="row">
    <div><label>Order email</label><input id="shopEmail" type="email"></div>
    <div><label>WhatsApp (country code + number)</label><input id="shopWa"></div>
  </div>
  <h2>Add an accessory / outfit photo</h2>
  <div class="row">
    <div><label>Type</label><select id="newCat"><option value="outfit">Outfit (pick one)</option><option value="head">Headwear (pick one)</option><option value="extra">Bags (pick many)</option></select></div>
    <div><label>Photo</label><input id="itemUp" type="file" accept="image/*"></div>
  </div>
  <p class="note">Best: a transparent PNG, or a photo of the item on a plain white background (tick “white background” below). Or photograph the doll wearing it from the same spot as the base photo and keep size 100%.</p>
  <div id="itemList"></div>
  <div id="itemEdit" hidden="">
    <label>Size <span id="szv"></span></label><input id="sz" type="range" min="10" max="250">
    <label>Rotate <span id="rtv"></span></label><input id="rt" type="range" min="-180" max="180">
    <label style="display:flex;gap:8px;align-items:center"><input id="mul" type="checkbox"> Photo has a plain white background</label>
    <p class="note">Tip: drag on the doll preview to move the selected item.</p>
  </div>
  <div style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn" id="save" type="button">Save &amp; publish</button><span id="saveMsg" class="note"></span></div>
</section>
<main>
  <section class="card preview">
    <div id="stage"></div>
    <div class="price"><span id="desc">Your bunny</span><b id="total"></b></div>
  </section>
  <section class="card">
    <div id="opts"></div>
    <h2>Your details</h2>
    <form id="f">
      <label>Name to embroider on the bunny (optional, +<span id="embp"></span>)</label>
      <input id="emb" maxlength="14" placeholder="e.g. Maya">
      <div class="row">
        <div><label>Your name *</label><input id="cname" required=""></div>
        <div><label>Phone / WhatsApp *</label><input id="phone" required="" inputmode="tel"></div>
      </div>
      <label>Email</label><input id="email" type="email">
      <label>Delivery address *</label><textarea id="addr" required=""></textarea>
      <div class="row">
        <div><label>Quantity</label><input id="qty" type="number" min="1" max="10" value="1"></div>
        <div><label>Needed by (optional)</label><input id="date" type="date"></div>
      </div>
      <label>Notes / gift message</label><textarea id="notes"></textarea>
      <button class="go" type="submit">Place order</button>
    </form>
    <div id="summary">
      <b>Order summary</b>
      <pre id="sumtext"></pre>
      <div class="btns"><a id="wa" target="_blank" rel="noopener">Send on WhatsApp</a><a id="mail">Send by email</a><button id="copy" type="button">Copy</button></div>
      <p class="note">Send the summary to us to confirm your order and payment details.</p>
    </div>
  </section>
</main>

function layerStyle(it){return "left:"+it.x+"%;top:"+it.y+"%;width:"+it.w+"%;transform:translate(-50%,-50%) rotate("+it.r+"deg);"+(it.m?"mix-blend-mode:multiply;":"");}
function renderStage(){
  var st=$("stage");st.innerHTML="";
  if(!cfg.base){var e=document.createElement("div");e.id="empty";e.textContent=canEdit?"Open “Edit shop” and upload a photo of your base doll.":"🐰 Our bunny is getting ready – check back soon!";st.appendChild(e);}
  else{var b=document.createElement("img");b.id="baseimg";b.src=cfg.base;b.alt="Base crochet bunny";b.draggable=false;st.appendChild(b);}
  chosen().forEach(function(it){var im=document.createElement("img");im.className="ly";im.src=it.url;im.alt=it.name;im.draggable=false;im.style.cssText=layerStyle(it);st.appendChild(im);});
  st.className=(adminOn&&sel)?"edit":"";
  $("total").textContent=money(price());
  var n=chosen().length;$("desc").textContent=n?"Your bunny + "+n+" item"+(n>1?"s":""):"Your bunny";
}
function pick(cat,it){
  if(cat==="extra")S.all[it.id]=!S.all[it.id];
  else{var was=S.all[it.id];cfg.items.forEach(function(i){if(i.cat===cat)delete S.all[i.id];});if(!was)S.all[it.id]=true;}
  renderOpts();renderStage();
}
function renderOpts(){
  var box=$("opts");box.innerHTML="";
  CATS.forEach(function(c){
    var items=cfg.items.filter(function(i){return i.cat===c[0];});
    if(!items.length)return;
    var h=document.createElement("h2");h.textContent=c[1]+(c[0]==="extra"?" (choose any)":" (pick one)");box.appendChild(h);
    var g=document.createElement("div");g.className="grid";
    if(c[0]!=="extra"){g.appendChild(card(c[0],null));}
    items.forEach(function(it){g.appendChild(card(c[0],it));});
    box.appendChild(g);
  });
  if(!cfg.items.length){var p=document.createElement("p");p.className="note";p.textContent="Outfits and accessories will appear here.";box.appendChild(p);}
}
function card(cat,it){
  var b=document.createElement("button");b.type="button";b.className="pick";
  var th=document.createElement("div");th.className="th";
  var on;
  if(it){var im=document.createElement("img");im.src=it.url;im.alt="";if(it.m)im.style.mixBlendMode="multiply";th.appendChild(im);
    var n=document.createTextNode(it.name);var s=document.createElement("small");s.textContent=it.price>0?"+"+money(+it.price):"included";
    b.appendChild(th);b.appendChild(n);b.appendChild(s);
    on=!!S.all[it.id];
    b.onclick=function(){pick(cat,it);};
  }else{th.textContent="✕";b.appendChild(th);b.appendChild(document.createTextNode("None"));on=!cfg.items.some(function(i){return i.cat===cat&&S.all[i.id];});b.onclick=function(){cfg.items.forEach(function(i){if(i.cat===cat)delete S.all[i.id];});renderOpts();renderStage();};}
  b.setAttribute("aria-pressed",on);return b;
}

// ---------- owner tools ----------
function renderAdmin(){
  $("basePrice").value=cfg.price;$("shopEmail").value=cfg.email;$("shopWa").value=cfg.wa;
  var L=$("itemList");L.innerHTML="";
  cfg.items.forEach(function(it){
    var r=document.createElement("div");r.className="irow"+(it.id===sel?" on":"");
    var n=document.createElement("input");n.value=it.name;n.oninput=function(){it.name=n.value;dirty=true;renderOpts();};
    var p=document.createElement("input");p.type="number";p.min="0";p.value=it.price;p.title="Extra price";p.oninput=function(){it.price=+p.value||0;dirty=true;renderOpts();renderStage();};
    var s=document.createElement("button");s.type="button";s.className="btn alt";s.textContent="Position";s.onclick=function(){selectItem(it.id);};
    var d=document.createElement("button");d.type="button";d.className="btn alt";d.textContent="🗑";d.setAttribute("aria-label","Delete");d.onclick=function(){
      cfg.items=cfg.items.filter(function(x){return x.id!==it.id;});if(sel===it.id)sel="";dirty=true;renderAll();};
    var t=document.createElement("small");t.textContent=({outfit:"Outfit",head:"Headwear",extra:"Bag"})[it.cat];
    r.appendChild(n);r.appendChild(p);r.appendChild(s);r.appendChild(d);r.appendChild(t);L.appendChild(r);
  });
  var it=byId(sel);$("itemEdit").hidden=!it;
  if(it){$("sz").value=it.w;$("rt").value=it.r;$("mul").checked=!!it.m;$("szv").textContent=Math.round(it.w)+"%";$("rtv").textContent=Math.round(it.r)+"°";}
}
function selectItem(id){
  sel=id;var it=byId(id);
  if(it.cat!=="extra")cfg.items.forEach(function(i){if(i.cat===it.cat)delete S.all[i.id];});
  S.all[id]=true;
  renderAll();
}
function renderAll(){renderOpts();renderStage();if(canEdit)renderAdmin();}
async function up(file){
  var A=await claude.use("assets");
  if(!A)throw new Error("Uploads are not available here");
  return await A.upload(file);
}
function msg(t){$("saveMsg").textContent=t;}
function setupAdmin(){
  $("adminBar").hidden=false;
  $("adminBtn").onclick=function(){adminOn=!adminOn;$("admin").hidden=!adminOn;$("adminBtn").textContent=adminOn?"Close editor":"✏️ Edit shop";renderAll();};
  $("baseUp").onchange=async function(){var f=this.files[0];if(!f)return;msg("Uploading…");
    try{var r=await up(f);cfg.base=r.url;dirty=true;msg("Photo added. Don’t forget to Save & publish.");renderAll();}catch(e){msg("Upload failed: "+(e.message||e.code||e));}};
  $("itemUp").onchange=async function(){var f=this.files[0];if(!f)return;msg("Uploading…");
    try{var r=await up(f);var it={id:"i"+Date.now(),cat:$("newCat").value,name:"New item",price:0,url:r.url,x:50,y:50,w:100,r:0,m:false};
      cfg.items.push(it);dirty=true;this.value="";msg("Added. Name it, set a price, then drag it into place.");selectItem(it.id);}catch(e){msg("Upload failed: "+(e.message||e.code||e));}};
  $("basePrice").oninput=function(){cfg.price=+this.value||0;dirty=true;renderStage();};
  $("shopEmail").oninput=function(){cfg.email=this.value;dirty=true;};
  $("shopWa").oninput=function(){cfg.wa=this.value.replace(/\D/g,"");dirty=true;};
  $("sz").oninput=function(){var it=byId(sel);it.w=+this.value;$("szv").textContent=Math.round(it.w)+"%";dirty=true;renderStage();};
  $("rt").oninput=function(){var it=byId(sel);it.r=+this.value;$("rtv").textContent=Math.round(it.r)+"°";dirty=true;renderStage();};
  $("mul").onchange=function(){byId(sel).m=this.checked;dirty=true;renderStage();renderOpts();};
  var drag=null,st=$("stage");
  st.addEventListener("pointerdown",function(e){var it=byId(sel);if(!adminOn||!it)return;drag={x:e.clientX,y:e.clientY};st.setPointerCapture(e.pointerId);});
  st.addEventListener("pointermove",function(e){if(!drag)return;var it=byId(sel),r=st.getBoundingClientRect();
    it.x+=(e.clientX-drag.x)/r.width*100;it.y+=(e.clientY-drag.y)/r.height*100;drag={x:e.clientX,y:e.clientY};dirty=true;renderStage();});
  st.addEventListener("pointerup",function(){drag=null;});
  $("save").onclick=async function(){
    msg("Publishing…");
    try{var A=await claude.use("artifact");if(!A)throw new Error("Publishing isn’t available to this account");
      await A.publish(buildHTML());msg("Published ✓");dirty=false;}
    catch(e){msg("Couldn’t publish: "+(e.message||e.code||e));}
  };
}
function buildHTML(){
  var c=JSON.stringify(cfg).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Little Loops – Custom Crochet Bunny</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet"><style id="css">'+$("css").textContent+'</style></head><body><div id="root"></div>'+$("tpl").outerHTML+'<script id="cfg" type="application/json">'+c+'<\/script><script id="main">'+$("main").textContent+'<\/script></body></html>';
}

// ---------- order ----------
function boot(){
  $("root").innerHTML=$("tpl").innerHTML;
  $("embp").textContent=money(cfg.emb);
  $("emb").addEventListener("input",renderStage);
  $("f").addEventListener("submit",function(e){
    e.preventDefault();
    var q=Math.max(1,parseInt($("qty").value)||1),u=price(),L=["NEW ORDER – Custom Crochet Bunny",""];
    var ch=chosen();
    [["outfit","Outfits"],["head","Headwear"],["extra","Bags"]].forEach(function(c){var n=ch.filter(function(x){return x.cat===c[0];}).map(function(x){return x.name;});L.push(c[1]+": "+(n.length?n.join(", "):"none"));});
    if($("emb").value.trim())L.push("Embroidered name: "+$("emb").value.trim());
    L.push("","Quantity: "+q,"Price each: "+money(u),"Total: "+money(u*q),"","Name: "+$("cname").value,"Phone: "+$("phone").value,"Email: "+($("email").value||"-"),"Address: "+$("addr").value,"Needed by: "+($("date").value||"-"),"Notes: "+($("notes").value||"-"));
    var t=L.join("\n");$("sumtext").textContent=t;
    $("wa").href="https://wa.me/"+cfg.wa+"?text="+encodeURIComponent(t);
    $("mail").href="mailto:"+cfg.email+"?subject="+encodeURIComponent("Custom bunny order")+"&body="+encodeURIComponent(t);
    $("summary").style.display="block";$("summary").scrollIntoView({behavior:"smooth",block:"nearest"});
  });
  $("copy").onclick=function(){var b=this;try{navigator.clipboard.writeText($("sumtext").textContent).then(function(){b.textContent="Copied ✓";});}catch(x){b.textContent="Select & copy above";}};
  renderAll();
  if(window.claude&&claude.use){
    claude.use("user").then(function(u){
      if(u&&u.canEdit()){canEdit=true;setupAdmin();renderAll();}
    }).catch(function(){});
  }
}
boot();
</script></body></html>
